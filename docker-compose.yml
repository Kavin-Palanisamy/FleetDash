services:
  mongo:
    image: mongo:7.0
    container_name: fleetdash-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: fleetdash-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongo:27017/fleetdash
      - USE_IN_MEMORY_DB=false
      - CLIENT_ORIGIN=http://localhost:5173
      - API_KEY=change-me
      - OFFLINE_AFTER_SECONDS=15
      - BATCH_FLUSH_MS=2000
      - RATE_LIMIT_ENABLED=true
      - RATE_LIMIT_WINDOW_MS=60000
      - RATE_LIMIT_MAX=10000
    depends_on:
      - mongo
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5000/api/health').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 5s

volumes:
  mongo_data:
